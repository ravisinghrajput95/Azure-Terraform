################################################################################
# Terraform CI
#
# Runs on every pull request and every push to main. Nothing here applies
# anything — this pipeline validates, lints, scans, prices and documents.
#
# Authentication is by OIDC workload identity federation, NOT a stored service
# principal secret. GitHub mints a short-lived token per run and Azure
# validates it against a federated credential scoped to this repository. There
# is no long-lived credential in repository secrets to leak or rotate.
#
# Required repository configuration (see .github/workflows/README.md):
#   Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              TFSTATE_RESOURCE_GROUP, TFSTATE_STORAGE_ACCOUNT
#   Secrets:   INFRACOST_API_KEY  (optional — that job is skipped without it)
################################################################################

name: Terraform CI

# scripts/**, .shellcheckrc and .tflint.hcl are in these filters deliberately.
# Without them the job that reads each one exists and never runs: a pull
# request touching only scripts/ would not start this workflow at all, and the
# branch would go green on a check that was never executed. That is a worse
# failure than having no check, because the tick mark is still there.
#
# .tflint.hcl was added after a commit changing the entire lint policy started
# no run at all — the same hole, one file along.
on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".shellcheckrc"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".shellcheckrc"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

# OIDC needs id-token: write. Everything else is least privilege — the workflow
# writes PR comments and nothing more.
permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  # Terraform's own colour codes make log output unreadable in Actions.
  TF_CLI_ARGS: "-no-color"
  # Pinned rather than using the runner's preinstalled ShellCheck, which is
  # 0.9.0 on ubuntu-24.04. The pre-commit hook is 0.11.0, and 0.10 and 0.11
  # both added checks — so an unpinned CI would be more permissive than the
  # local hook, and a developer would see CI pass what their own commit hook
  # rejected. Keep this in step with the shellcheck-py rev in
  # .pre-commit-config.yaml.
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  ##############################################################################
  # Format and validate
  #
  # Runs with -backend=false so it needs no Azure credentials at all. This is
  # the fastest signal and gates everything else.
  ##############################################################################
  validate:
    name: Format & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: |
          if ! terraform fmt -check -recursive terraform/; then
            echo "::error::Files are not formatted. Run: terraform fmt -recursive terraform/"
            exit 1
          fi

      - name: terraform validate — every module and environment
        run: |
          set -euo pipefail
          failed=0
          for dir in terraform/modules/*/ terraform/environments/*/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "::group::validate $dir"
            if ! (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate); then
              echo "::error file=${dir}::terraform validate failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # The four environments are near-copies, which is what makes them cheap
      # to add and what makes them drift. Every copy-paste defect found so far
      # was found by someone reading two files side by side — and three had
      # reached a `description`, which is a real attribute on the Azure
      # resource, not a comment. Reads .tf files only; no Azure, no Terraform.
      - name: environment conformance
        run: python3 scripts/check-environment-conformance.py

  ##############################################################################
  # Unit and composition tests
  #
  # Every test file mocks the provider, so `terraform test` runs with no cloud
  # access whatsoever — no credentials, no backend, no resource created. This
  # job therefore needs no Azure secrets and runs on forks.
  #
  # Environments and bootstrap are included as well as modules. The module
  # tests check each module against its own contract; the environment tests
  # check the wiring between them, which is the layer no module test can see.
  # For qa, stage and prod that is the only verification available at all —
  # none of the three can be applied on this subscription. bootstrap is the
  # inverse case: the one configuration that is deployed, on local state.
  ##############################################################################
  test:
    name: Module and environment tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform test
        run: |
          set -euo pipefail
          failed=0
          for dir in terraform/modules/*/ terraform/environments/*/ bootstrap/; do
            [ -d "${dir}tests" ] || continue
            echo "::group::test ${dir}"
            if ! (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform test); then
              echo "::error file=${dir}::terraform test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  ##############################################################################
  # TFLint
  #
  # Catches what `terraform validate` cannot: deprecated syntax, unused
  # declarations, and provider-specific rules such as invalid Azure VM sizes and
  # malformed resource names — the class of error that otherwise fails minutes
  # into an apply.
  ##############################################################################
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      # Pinned, like ShellCheck and terraform-docs, and for the reason
      # .tflint.hcl gives for pinning providers: an unpinned linter means a
      # build that passed yesterday can fail today for reasons nobody changed.
      # It also keeps CI in step with what `make lint` runs locally — the two
      # having silently differed is what let the missing --config below go
      # unnoticed.
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - run: tflint --init

      # --config is not optional, and its absence is invisible.
      #
      # `tflint --chdir=<dir>` looks for .tflint.hcl INSIDE that directory. No
      # module has one, so without an explicit path tflint ran with its default
      # configuration: the bundled terraform rules only, and no azurerm ruleset
      # at all. The job passed, in about 0.08s per directory, while not
      # performing the check this repository documents as its reason for
      # existing — an invalid VM size went unreported here for as long as the
      # job has been green.
      #
      # Verified by planting `size = "Standard_NOT_A_REAL_SIZE"` in a scratch
      # module: unreported without --config, reported with it. The absolute
      # path is required because --chdir has already moved.
      - name: Lint every module and environment
        run: |
          set -euo pipefail
          config="$(pwd)/.tflint.hcl"
          failed=0
          for dir in terraform/modules/*/ terraform/environments/*/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --config="$config" --format=compact || failed=1
            echo "::endgroup::"
          done
          exit $failed

  ##############################################################################
  # ShellCheck
  #
  # scripts/ holds the four checks that answer what `terraform plan` cannot, so
  # a defect in one of them is a defect in the verification itself. Running
  # those scripts against the live subscription found four such defects that
  # reading them had not — including `A && B || C` used as if it were
  # if-then-else, where the C branch set fail=1 and a printf returning non-zero
  # would have marked a passing check as failed.
  #
  # This job does not `needs: validate`. It shares no tooling with Terraform,
  # and gating a shell lint behind `terraform validate` only makes a scripts-
  # only change wait on an unrelated result.
  ##############################################################################
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From the upstream release rather than the runner's preinstalled copy or
      # a third-party action, so the version is the one this file pins.
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          base="https://github.com/koalaman/shellcheck/releases/download"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "${base}/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$HOME/.local/bin" --strip-components=1 \
                "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Check selection lives in .shellcheckrc — the same file the pre-commit
      # hook and `make lint` read. There are deliberately no flags here.
      #
      # Two things are asserted rather than assumed, because both would fail
      # silently and leave a green tick behind:
      #
      #   - the version actually on PATH. The runner ships ShellCheck 0.9.0; if
      #     the install step above ever stops taking effect, CI would quietly
      #     fall back to it and enforce a weaker check set than the commit hook.
      #   - a non-empty file list. Discovery is by shebang as well as by
      #     extension, so a script added without a .sh suffix is still linted —
      #     and a linter reporting success over a file set it never built is
      #     exactly the failure shape this repository exists to catch.
      #
      # It also refuses a file that this job would lint and the commit hook
      # would not. pre-commit's `shell` type is satisfied by a .sh suffix, or
      # by a shebang on an executable file — a shebang on a non-executable file
      # is not enough. Without this check the two would disagree silently, in
      # the direction where a developer's hook passes and CI fails.
      - name: ShellCheck every shell script
        run: |
          set -euo pipefail

          have=$(shellcheck --version | awk '/^version:/ {print $2}')
          if [ "$have" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::ShellCheck $have is on PATH, expected $SHELLCHECK_VERSION"
            exit 1
          fi
          echo "ShellCheck $have"

          files=$( { git ls-files -- '*.sh'
                     git ls-files | while read -r f; do
                       if [ -f "$f" ] && head -n1 "$f" 2>/dev/null \
                            | grep -qE '^#!.*(bash|/sh$|env sh$)'; then
                         printf '%s\n' "$f"
                       fi
                     done
                   } | sort -u )

          if [ -z "$files" ]; then
            echo "::error::no shell scripts found — ShellCheck would have passed over nothing"
            exit 1
          fi
          echo "$files" | sed 's/^/  /'

          unhookable=$( { echo "$files" | grep -v '\.sh$' || true; } | while read -r f; do
                          if [ -n "$f" ] && [ ! -x "$f" ]; then printf '%s\n' "$f"; fi
                        done )
          if [ -n "$unhookable" ]; then
            echo "$unhookable" | while read -r f; do
              echo "::error file=${f}::neither a .sh suffix nor the executable bit — the pre-commit shellcheck hook will skip this file silently while CI lints it. chmod +x it, or give it a .sh suffix."
            done
            exit 1
          fi

          # Human-readable output first, then the same findings again as
          # annotations so they land on the diff rather than in a log nobody
          # opens. ShellCheck exits non-zero for anything at or above the
          # severity floor in .shellcheckrc.
          if ! echo "$files" | xargs shellcheck; then
            echo "$files" | xargs shellcheck --format=gcc \
              | sed -E 's|^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$|::error file=\1,line=\2,col=\3::\4|'
            exit 1
          fi

      # ShellCheck reads the scripts; this runs them. The failure it guards
      # against is not a crash but a script that exits 0 without checking
      # anything — `set -euo pipefail` missing, so a failed command is ignored
      # and the next runs against empty output. Needs no Azure.
      - name: Script invariants
        run: ./scripts/tests/test-scripts.sh

  ##############################################################################
  # Security scanning
  #
  # Trivy for misconfiguration and Checkov for policy. They overlap but not
  # completely — Trivy is faster and catches provider-level issues, Checkov has
  # deeper Azure-specific policy coverage.
  #
  # Results upload as SARIF so findings appear inline on the pull request rather
  # than buried in a log.
  ##############################################################################
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Tags on this action carry a `v` prefix. `@0.28.0` was never a resolvable
      # ref, so this step failed with "unable to find version" on every run it
      # ever reached — which was none, until the validate job started passing.
      - name: Trivy — misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0" # report, do not block; the gate is the SARIF review

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Checkov — policy scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          download_external_modules: false

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      # Per-directory scan, which is NOT what the SARIF step above does.
      #
      # `scan-ref: terraform/` walks the tree, and a tree scan and a per-module
      # scan do not agree: terraform/ reported clean while terraform/modules/aks
      # alone reported a CRITICAL (AZU-0041). The pre-commit hook works per
      # directory, so it failed on a finding this job had never seen — CI was
      # the weaker of the two. A module is the unit that gets reused, so a
      # module has to be clean on its own.
      #
      # bootstrap/ is scanned here and not above: scan-ref never included it,
      # so the state backend had no automated scan at all.
      - name: Trivy — per-directory scan
        run: |
          set -uo pipefail
          failed=0
          for dir in terraform/modules/*/ terraform/environments/*/ bootstrap/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            if ! out=$(trivy config --exit-code 1 --severity HIGH,CRITICAL "$dir" 2>/dev/null); then
              echo "::group::trivy $dir"
              echo "$out"
              echo "::endgroup::"
              echo "$out" | grep -E '^AZU-|^AVD-' | while read -r line; do
                echo "::error file=${dir}::${line}"
              done
              failed=1
            fi
          done
          exit $failed

      # Blocks only on CRITICAL. HIGH and below are reported for triage —
      # a scanner that fails the build on every advisory gets muted, and a
      # muted scanner protects nothing.
      - name: Fail on CRITICAL findings
        run: |
          count=$(python3 -c "
          import json
          try:
              d = json.load(open('trivy.sarif'))
              n = sum(1 for r in d.get('runs', [])
                        for res in r.get('results', [])
                        if res.get('level') == 'error')
              print(n)
          except Exception:
              print(0)
          ")
          echo "CRITICAL findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::$count CRITICAL security findings. See the Security tab."
            exit 1
          fi

  ##############################################################################
  # Documentation
  #
  # terraform-docs regenerates the input and output tables inside each module
  # README, between BEGIN_TF_DOCS and END_TF_DOCS markers. The prose around them
  # is hand-written and untouched.
  #
  # On a pull request this FAILS if docs are stale rather than committing for
  # you — an auto-commit from CI re-triggers the workflow and muddies the
  # history.
  ##############################################################################
  docs:
    name: Terraform docs
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate module documentation
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: terraform/modules
          find-dir: terraform/modules
          output-file: README.md
          output-method: inject
          git-push: "false"
          fail-on-diff: "true"

  ##############################################################################
  # Cost estimation
  #
  # Infracost prices the plan and comments the delta on the pull request. It is
  # the answer to "how much does this change cost", which is otherwise
  # discovered on next month's bill.
  #
  # Skipped when INFRACOST_API_KEY is absent so the pipeline works in a fork.
  ##############################################################################
  cost:
    name: Cost estimate
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check for Infracost key
        id: guard
        run: echo "enabled=${{ secrets.INFRACOST_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: infracost/actions/setup@v3
        if: steps.guard.outputs.enabled == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Baseline cost on the target branch
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git checkout "${{ github.event.pull_request.base.sha }}"
          infracost breakdown \
            --path=terraform/environments \
            --format=json \
            --out-file=/tmp/infracost-base.json
          git checkout "${{ github.event.pull_request.head.sha }}"

      - name: Cost diff
        if: steps.guard.outputs.enabled == 'true'
        run: |
          infracost diff \
            --path=terraform/environments \
            --compare-to=/tmp/infracost-base.json \
            --format=json \
            --out-file=/tmp/infracost.json

      - name: Comment on the pull request
        if: steps.guard.outputs.enabled == 'true'
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" \
            --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --behavior=update

      - name: Note when skipped
        if: steps.guard.outputs.enabled != 'true'
        run: echo "::notice::INFRACOST_API_KEY is not set — cost estimation skipped."

  ##############################################################################
  # Plan
  #
  # Runs against real state, so it needs Azure. A plan is read-only, but it
  # takes a state LOCK — hence the concurrency group above, which prevents two
  # runs deadlocking on the same environment.
  #
  # -detailed-exitcode: 0 no changes, 1 error, 2 changes present.
  ##############################################################################
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [validate, tflint]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    steps:
      - uses: actions/checkout@v4

      # Guarded the same way the cost job guards INFRACOST_API_KEY. Without
      # this, azure/login fails with "Not all values are present" on any repo
      # or fork where the OIDC variables are not configured — an authentication
      # error that says nothing about the change being reviewed. It is the same
      # failure that has been turning the drift workflow red every morning.
      - name: Check for Azure credentials
        id: guard
        run: echo "enabled=${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        if: steps.guard.outputs.enabled == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.guard.outputs.enabled == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Note when skipped
        if: steps.guard.outputs.enabled != 'true'
        run: |
          echo "::notice::AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID are not set — plan skipped. See .github/workflows/README.md."

      - name: Terraform plan
        if: steps.guard.outputs.enabled == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-${{ matrix.environment }}" \
            -backend-config="key=cloudcart.${{ matrix.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

          terraform plan -input=false -detailed-exitcode -out=tfplan | tee plan.txt
          echo "exit=$?"

      - name: Comment plan on the pull request
        uses: actions/github-script@v7
        if: always() && steps.guard.outputs.enabled == 'true'
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/environments/${{ matrix.environment }}/plan.txt';
            if (!fs.existsSync(path)) return;
            let plan = fs.readFileSync(path, 'utf8');
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(-LIMIT) + '\n\n... truncated, see the workflow log for the full plan.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Plan — \`${{ matrix.environment }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
            });
