  <text x="926" y="962" font-size="12" fill="#1B1B1F" font-weight="600" text-anchor="start">Purple dashed</text>
  <text x="926" y="980" font-size="11" fill="#5C5C66" font-weight="normal" text-anchor="start">DNS resolution</text>
  <path d="M 1256 966 L 1314 966" fill="none" stroke="#107C10" stroke-width="1.7" stroke-dasharray="2 5" marker-end="url(#ah-wi)"/>
  <text x="1326" y="962" font-size="12" fill="#1B1B1F" font-weight="600" text-anchor="start">Green dotted</text>
  <text x="1326" y="980" font-size="11" fill="#5C5C66" font-weight="normal" text-anchor="start">Workload identity</text>
</svg>
