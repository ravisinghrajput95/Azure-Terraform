# Pre-commit hooks — the same checks CI runs, moved to commit time.
#
# CI is the gate; this is the fast feedback. Anything here that is slow or
# needs cloud credentials is deliberately left to CI alone: a hook that takes
# a minute gets bypassed with --no-verify, and a bypassed hook is worse than
# no hook because it is still believed in.
#
#   pre-commit install
#
# Note terraform_validate and terraform_tflint run `terraform init` per
# directory on first use, so the first commit after installing is slow and
# every one after it is not.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

      # State is a secret: it holds resource IDs, connection metadata and any
      # value a provider marked sensitive but still had to persist. The
      # .gitignore covers it; this is the second line.
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        exclude: ^terraform/environments/(qa|stage|prod)/
        args:
          - --hook-config=--retry-once-with-cleanup=true

      - id: terraform_tflint
        exclude: ^terraform/environments/(qa|stage|prod)/
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

      # Misconfiguration scan. Runs on changed directories only, so it stays
      # fast enough not to be bypassed.
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL

  # ShellCheck. The scripts in scripts/ are the checks that answer what
  # `terraform plan` cannot, so a defect in one is a defect in the verification
  # itself — and every defect found in them so far was found by running them,
  # not by reading them. This is the cheapest of the two.
  #
  # shellcheck-py rather than koalaman/shellcheck-precommit: the latter runs in
  # Docker, which is slow enough on a cold image to get the hook bypassed. This
  # one is a wheel with the binary inside it, and 0.11.0.1 wraps the same
  # ShellCheck 0.11.0 that CI pins.
  #
  # No args: check selection lives in .shellcheckrc so this hook, `make lint`
  # and CI cannot drift apart. Files are selected by pre-commit's `shell` type,
  # which reads the shebang — a script without a .sh extension is still caught.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
